
apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-book-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-book-management
  template:
    metadata:
      labels:
        app: library-book-management
    spec:
      containers:
        - name: library-book-management
          image: shabbu2007/library-book-management:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
